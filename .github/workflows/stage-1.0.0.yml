name: Stage verified 1.0.0 artifact
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  stage:
    if: github.repository == 'AntoineW/luge'
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.15.0
      - name: Download and verify the released tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 --repo AntoineW/luge --pattern waaark-luge-1.0.0.tgz
          echo '861a3e652f33284a928cc6ee52789bd59eadb19eb5546f84ffa661b2b1392ab5  waaark-luge-1.0.0.tgz' | sha256sum --check
      - name: Stage for maintainer approval
        run: npm stage publish waaark-luge-1.0.0.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
